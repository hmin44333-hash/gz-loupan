// ─── 工具函数 ───
function esc(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function highlightPrice(text){
    // 匹配：数字(可选小数) 万元/㎡ 或 数字-数字 万元 等模式
    return text.replace(
        /(\d+(?:\.\d+)?[\-\–\—~～]?\d*(?:\.\d+)?\s*万元(?:[\/／]㎡)?)/g,
        '<span class="price-highlight">$1</span>'
    );
}

function renderTags(p){
    var html='';
    if(p.commute) html+='<span class="tag tag-metro">'+esc(p.commute)+'</span>';
    if(p.school) html+='<span class="tag tag-school">'+esc(p.school)+'</span>';
    if(p.commercial) html+='<span class="tag tag-biz">'+esc(p.commercial)+'</span>';
    if(html) return '<div class="tags">'+html+'</div>';
    return '';
}

function renderFloorplans(fp){
    if(!fp || !fp.length) return '';
    var items=fp.map(function(item){
        var url = (typeof item === 'string') ? item : (item.url || '');
        var label = (typeof item === 'object' && item.label) ? item.label : '';
        var thumb = '<img class="fp-thumb" src="'+url+'" onclick="openLb(this.src)" loading="lazy" alt="户型图">';
        var tag = label ? '<span class="fp-tag" onclick="openLb(\''+url+'\')">'+esc(label)+'</span>' : '';
        return '<div class="fp-item">'+thumb+tag+'</div>';
    }).join('');
    return '<div class="fp-gallery"><div class="fp-label">户型图</div><div class="fp-grid">'+items+'</div></div>';
}

// ─── 渲染卡片 ───
function renderCard(p){
    var priceHtml=p.price ? '<div class="price-section"><div class="price-line">'+highlightPrice(esc(p.price))+'</div></div>' : '';
    var analysisHtml=p.analysis ? '<div class="analysis-section"><div class="a-label">📋 单敏分析</div><div class="a-text">'+esc(p.analysis)+'</div></div>' : '';
    var pcHtml='';
    if(p.pros||p.cons){
        pcHtml='<div class="pc-grid>';
        if(p.pros) pcHtml+='<div class="pc-box pc-pros"><span class="pc-lbl">✅ 亮点</span>'+esc(p.pros)+'</div>';
        if(p.cons) pcHtml+='<div class="pc-box pc-cons"><span class="pc-lbl">⚠️ 注意</span>'+esc(p.cons)+'</div>';
        pcHtml+='</div>';
    }

    return '<article class="project-card">'+
        '<div class="pcard-head">'+
            '<span class="pcard-name">'+esc(p.name)+'</span>'+
            '<span class="pcard-district">'+esc(p.district)+'</span>'+
        '</div>'+
        '<div class="pcard-body">'+
            priceHtml+
            analysisHtml+
            pcHtml+
            renderTags(p)+
            renderFloorplans(p.floorplans)+
        '</div>'+
    '</article>';
}

// ─── 筛选逻辑 ───
var curDist='all';
var teamPanel=document.getElementById('team-panel');
var projPanel=document.getElementById('project-panel');
var listEl=document.getElementById('project-list');
var btns=document.querySelectorAll('.filter-btn');

function switchView(dist){
    curDist=dist;
    btns.forEach(function(b){
        b.classList.toggle('active', b.dataset.district===dist);
    });
    if(dist==='all'){
        teamPanel.style.display='';
        projPanel.style.display='none';
    }else{
        teamPanel.style.display='none';
        projPanel.style.display='';
        var filtered=PROJECTS.filter(function(p){ return p.district===dist; });
        if(filtered.length===0){
            listEl.innerHTML='<div class="empty-state"><p>该区域暂无项目数据</p></div>';
        }else{
            listEl.innerHTML=filtered.map(renderCard).join('');
        }
    }
    // 滚动到内容顶部
    document.getElementById('content').scrollIntoView({behavior:'smooth'});
}

btns.forEach(function(b){
    b.addEventListener('click',function(){ switchView(this.dataset.district); });
});

// ─── 初始化 ───
document.getElementById('stat-total').textContent=PROJECTS.length;
var now=new Date();
var m=(now.getMonth()+1).toString().padStart(2,'0');
var d=now.getDate().toString().padStart(2,'0');
document.getElementById('stat-date').textContent=m+'-'+d;

})();

// Lightbox
window.openLb=function(src){
    document.getElementById('lb-img').src=src;
    document.getElementById('lb').classList.add('show');
};
</script>
